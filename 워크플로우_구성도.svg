<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="600" viewBox="0 0 1490 600" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans KR, sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect x="0" y="0" width="1490" height="600" fill="#ffffff"/>
<text x="44" y="40" font-size="21" font-weight="800" fill="#0f172a">SnowBuild — 서비스 구성도</text>
<text x="44" y="62" font-size="13" fill="#64748b">웹 서비스(대시보드 + 챗봇)로 동작하며, 핵심 AI 기능은 SNOWCHAT API Gateway를 통해 처리됩니다.</text>

<!-- A. 요청 처리 순서 -->
<rect x="44" y="88" width="24" height="24" rx="6" fill="#0f172a"/>
<text x="56" y="105" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
<text x="78" y="106" font-size="15" font-weight="800" fill="#0f172a">요청 처리 순서</text>
<text x="190" y="106" font-size="12.5" fill="#64748b">사용자가 한 번 입력하면 이 순서로 처리됩니다</text>

<!-- 카드 1: 입력 -->
<rect x="55" y="124" width="252" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="75" y="148" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="0.4">웹 화면</text>
<circle cx="89" cy="178" r="14" fill="#2563eb"/><text x="89" y="183" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="112" y="184" font-size="17" font-weight="800" fill="#0f172a">입력</text>
<text x="75" y="220" font-size="12.5" fill="#334155">대시보드에서 단계를 고르고</text>
<text x="75" y="241" font-size="12.5" fill="#334155">챗봇에 질문·화면 캡처 입력</text>

<!-- 카드 2: 보안 점검 -->
<rect x="337" y="124" width="252" height="150" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="357" y="148" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.4">SnowBuild 서버</text>
<circle cx="371" cy="178" r="14" fill="#475569"/><text x="371" y="183" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="394" y="184" font-size="17" font-weight="800" fill="#0f172a">보안 점검</text>
<text x="357" y="220" font-size="12.5" fill="#334155">이름·학번 등 개인정보와</text>
<text x="357" y="241" font-size="12.5" fill="#334155">비공개자료를 자동 차단</text>

<!-- 카드 3: 의도 분류 -->
<rect x="619" y="124" width="252" height="150" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="639" y="148" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.4">SnowBuild 서버</text>
<circle cx="653" cy="178" r="14" fill="#475569"/><text x="653" y="183" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="676" y="184" font-size="17" font-weight="800" fill="#0f172a">의도 분류</text>
<text x="639" y="220" font-size="12.5" fill="#334155">지금 단계와 요청 종류를</text>
<text x="639" y="241" font-size="12.5" fill="#334155">판단해 알맞은 기능으로 연결</text>

<!-- 카드 4: AI 처리 -->
<rect x="901" y="124" width="252" height="150" rx="12" fill="#0f172a"/>
<text x="921" y="148" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.4">SNOWCHAT API Gateway</text>
<circle cx="935" cy="178" r="14" fill="#2563eb"/><text x="935" y="183" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="958" y="184" font-size="17" font-weight="800" fill="#ffffff">AI 처리</text>
<text x="921" y="220" font-size="12.5" fill="#e2e8f0">인터뷰·프롬프트 팩·원인 진단</text>
<text x="921" y="241" font-size="12.5" fill="#94a3b8">작업 난이도별로 모델 배정</text>

<!-- 카드 5: 저장·표시 -->
<rect x="1183" y="124" width="252" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1203" y="148" font-size="11" font-weight="700" fill="#7c3aed" letter-spacing="0.4">서버 → 웹 · Google</text>
<circle cx="1217" cy="178" r="14" fill="#7c3aed"/><text x="1217" y="183" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="1240" y="184" font-size="17" font-weight="800" fill="#0f172a">저장 · 표시</text>
<text x="1203" y="220" font-size="12.5" fill="#334155">산출물을 저장해 대시보드에</text>
<text x="1203" y="241" font-size="12.5" fill="#334155">표시, Google 문서·시트로 내보내기</text>

<line x1="307" y1="199" x2="333" y2="199" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<line x1="589" y1="199" x2="615" y2="199" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<line x1="871" y1="199" x2="897" y2="199" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<line x1="1153" y1="199" x2="1179" y2="199" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>

<path d="M1309,274 L1309,300 L181,300 L181,278" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="632" y="291" width="226" height="18" fill="#ffffff"/>
<text x="745" y="304" font-size="12" fill="#64748b" text-anchor="middle">대시보드의 '다음 할 일'로 다음 입력이 이어짐</text>

<!-- B. 단계 진행 순서 -->
<line x1="44" y1="336" x2="1446" y2="336" stroke="#e2e8f0" stroke-width="1"/>
<rect x="44" y="358" width="24" height="24" rx="6" fill="#0f172a"/>
<text x="56" y="375" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
<text x="78" y="376" font-size="15" font-weight="800" fill="#0f172a">단계 진행 순서</text>
<text x="190" y="376" font-size="12.5" fill="#64748b">대시보드 상단 진행 바 · 필수 산출물이 갖춰져야 다음 단계가 열립니다</text>

<rect x="96" y="396" width="366" height="110" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.6"/>
<text x="279" y="432" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">① Think · 설계</text>
<text x="279" y="454" font-size="12" fill="#0284c7" text-anchor="middle">디자이너·기획자 역할</text>
<text x="279" y="484" font-size="12.5" fill="#334155" text-anchor="middle">산출물: 요구사항표 · 과업 카드 · 판정 기준</text>

<rect x="562" y="396" width="366" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="745" y="432" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">② Make · 제작</text>
<text x="745" y="454" font-size="12" fill="#7c3aed" text-anchor="middle">개발자 역할</text>
<text x="745" y="484" font-size="12.5" fill="#334155" text-anchor="middle">산출물: 프롬프트 팩 · 빌드 대조 기록</text>

<rect x="1028" y="396" width="366" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="1211" y="432" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">③ Check · 검증</text>
<text x="1211" y="454" font-size="12" fill="#d97706" text-anchor="middle">QA·리뷰어 역할</text>
<text x="1211" y="484" font-size="12.5" fill="#334155" text-anchor="middle">산출물: 테스트 시나리오 · 판정 기록</text>

<line x1="462" y1="451" x2="558" y2="451" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="510" y="440" font-size="11.5" fill="#475569" text-anchor="middle">🔒 필수 산출물</text>
<line x1="928" y1="451" x2="1024" y2="451" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="976" y="440" font-size="11.5" fill="#475569" text-anchor="middle">🔒 필수 산출물</text>

<path d="M1211,506 L1211,534 L279,534 L279,510" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahA)"/>
<line x1="745" y1="534" x2="745" y2="510" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahA)"/>
<rect x="866" y="525" width="230" height="18" fill="#ffffff"/>
<text x="981" y="538" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">검증 실패 → 원인 진단 후 설계·제작으로 복귀</text>

<text x="745" y="578" font-size="12" fill="#64748b" text-anchor="middle">※ 각 단계 안에서 일어나는 모든 대화는 A의 순서(입력 → 보안 점검 → 의도 분류 → AI 처리 → 저장·표시)로 처리됩니다.</text>
</svg>
